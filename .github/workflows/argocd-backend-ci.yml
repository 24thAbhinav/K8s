name: argocd-backend-ci

on:
  push:
    branches:
      - main
    paths:
      - basics/argocd/backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argocd-backend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: abhinavchauhan24/argocd-backend
  GITOPS_REPO: 24thAbhinav/GitOps
  GITOPS_BRANCH: main
  GITOPS_MANIFEST: k8s/deployment.yaml

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout K8s repository
        uses: actions/checkout@v4

      - name: Set short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: basics/argocd/backend
          file: basics/argocd/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag and push GitOps manifest
        working-directory: gitops
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          sed -i -E "s|image: ${IMAGE_NAME}:[^[:space:]]+|image: ${IMAGE_NAME}:${SHORT_SHA}|" "${GITOPS_MANIFEST}"

          if git diff --quiet -- "${GITOPS_MANIFEST}"; then
            echo "Manifest already references ${SHORT_SHA}; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GITOPS_MANIFEST}"
          git commit -m "chore: update argocd-backend image to ${SHORT_SHA}"
          git push origin "HEAD:${GITOPS_BRANCH}"
