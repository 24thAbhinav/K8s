# Backend (Express) — Deployment + ClusterIP Service
#
# Talks to Postgres at postgres:5432, serves /api/items and /healthz.
# Ingress routes /api here from outside the cluster.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp-ingress
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Image source:
          #   Path A (local dev) — build + `kind load docker-image webapp-backend:1.0 --name my-cluster`
          #   Path B (registry)  — push to a registry and use: image: <registry>/webapp-backend:1.0
          image: webapp-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: demo
            - name: PGPASSWORD
              value: demo
            - name: PGDATABASE
              value: demo
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: webapp-ingress
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
