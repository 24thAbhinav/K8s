# Express backend: Deployment + ClusterIP Service
#
# Reach it from your machine with:
#   kubectl port-forward -n backend svc/express 3000:3000
#   open http://localhost:3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: express
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express
  template:
    metadata:
      labels:
        app: express
    spec:
      containers:
        - name: express
          # Image source:
          #   Path A (local dev) — build + `kind load docker-image express-pg-demo:1.0 --name my-cluster`
          #   Path B (registry)  — push to a registry and use: image: <registry>/express-pg-demo:1.0
          image: express-pg-demo:1.0
          imagePullPolicy: IfNotPresent   # Path A: use the loaded image. Path B with a :latest tag → set to Always.
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: postgres       # the ClusterIP Service name
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: demo
            - name: PGPASSWORD
              value: demo
            - name: PGDATABASE
              value: demo
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: express
  namespace: backend
spec:
  selector:
    app: express
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
