# A Secret holding a whole .env file. `data` values are base64-encoded strings,
# so we encode the file's contents:
#   base64 -i .env            # macOS
#   cat .env | base64         # Linux
apiVersion: v1
kind: Secret
metadata:
  name: backend-env
type: Opaque
data:
  # Decodes to the contents of .env (APP_MODE, LOG_LEVEL, API_KEY)
  .env: QVBQX01PREU9ZGV2ZWxvcG1lbnQKTE9HX0xFVkVMPWRlYnVnCkFQSV9LRVk9ZGV2LWFwaS1rZXktMTIzNDU2Cg==
