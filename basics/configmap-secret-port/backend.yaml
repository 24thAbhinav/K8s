# The backend Deployment imports PORT/DB from the backend-config ConfigMap
# and DB_PASSWORD from the backend-secret Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: configmap-port-backend:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000 # must match PORT in the ConfigMap
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config # the ConfigMap name
                  key: PORT # the key to import
            - name: DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret # the Secret name
                  key: DB_PASSWORD # the key to import
          # --- Mounting the .env Secret (two ways) ---
          # Option A (used here): mount just the ".env" key as a file at /app/.env.
          #   `subPath` is required because a volume mount REPLACES whatever is at
          #   mountPath — mounting at /app would wipe out server.js/node_modules.
          #   Caveat: a subPath file is frozen at container start and does NOT
          #   refresh when the Secret changes (restart the Pod to pick up edits).
          # Option B: mount the whole Secret into its own fresh directory, e.g.
          #   volumeMounts:
          #     - name: env-file
          #       mountPath: /etc/backend-env
          #       readOnly: true
          #   then point dotenv at /etc/backend-env/.env (ENV_FILE env var).
          #   A plain directory mount DOES refresh when the Secret changes, but the
          #   app still only reads the file once at startup.
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: env-file
          secret:
            secretName: backend-env
