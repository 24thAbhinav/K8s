# The backend Deployment imports PORT/DB from the backend-config ConfigMap
# and DB_PASSWORD from the backend-secret Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: configmap-port-backend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000 # must match PORT in the ConfigMap
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config # the ConfigMap name
                  key: PORT # the key to import
            - name: DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret # the Secret name
                  key: DB_PASSWORD # the key to import
