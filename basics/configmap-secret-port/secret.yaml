# A Secret for sensitive values. Unlike a ConfigMap, the values under `data`
# are base64-encoded (NOT encrypted) — the backend imports DB_PASSWORD from it.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
data:
  # echo -n 's3cr3t-db-p@ss' | base64
  DB_PASSWORD: czNjcjN0LWRiLXBAc3M=
