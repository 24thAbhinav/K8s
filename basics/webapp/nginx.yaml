# NGINX reverse proxy — ConfigMap + Deployment + ClusterIP Service
#
#   /api/  → backend:3000   (Express)
#   /      → frontend:80    (static page)
#
# This is the single entry point. Expose it with:
#   kubectl port-forward -n webapp svc/nginx 8080:80   → http://localhost:8080

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: webapp
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # API traffic → the backend Service
      location /api/ {
        proxy_pass       http://backend:3000;
        proxy_set_header Host $host;
      }

      # Everything else → the frontend Service
      location / {
        proxy_pass       http://frontend:80;
        proxy_set_header Host $host;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: webapp
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: nginx-conf

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: webapp
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
