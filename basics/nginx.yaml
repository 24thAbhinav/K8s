# NGINX reverse proxy in one file: config + Deployment + Service
#
# The NGINX config lives in a ConfigMap and is mounted into the Pod.
# It serves a static page on "/" and forwards "/api" to the `backend`
# ClusterIP Service — a hand-rolled version of what an Ingress does.
#
# Apply:    kubectl apply -f nginx.yaml
# View:     kubectl port-forward svc/nginx 8080:80   → http://localhost:8080

---
# 1) Config — the actual nginx.conf server block
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # Static content served by NGINX itself
      location / {
        root  /usr/share/nginx/html;
        index index.html;
      }

      # Internal routing: /api → the `backend` ClusterIP Service.
      # `backend.default.svc.cluster.local` is the fully-qualified Service DNS
      # name; the short form `backend` also works since nginx is in `default`.
      location /api/ {
        proxy_pass         http://backend.default.svc.cluster.local:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      }

      # Tip: to also send "/" to a frontend app, change the location above to:
      #   location / { proxy_pass http://frontend.default.svc.cluster.local:80/; }
    }

---
# 2) Deployment — runs NGINX with the config mounted
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: nginx-config  

---
# 3) Service — reach the proxy inside the cluster (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: default
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
